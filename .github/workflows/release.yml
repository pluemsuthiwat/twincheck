# Builds the Windows installer, signs the updater artifacts, and creates a DRAFT GitHub Release
# with latest.json. The macOS builds are made, signed and notarized on the maintainer's Mac with
# scripts/release-mac.sh, which adds them to this draft. Publishing the draft is what makes
# installed apps see the update (they read releases/latest/download/latest.json).
#
# Release: bump "version" in the root package.json, commit, then `git tag v1.2.3 && git push --tags`.
# Secrets: TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/twincheck.key),
#          TAURI_SIGNING_PRIVATE_KEY_PASSWORD (only if the key has a password).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: TwinCheck v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
