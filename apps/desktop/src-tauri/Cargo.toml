[package]
name = "twincheck"
version = "0.1.0"
description = "TwinCheck - semantic config compare"
edition = "2021"
license = "MIT"

[lib]
name = "twincheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
